# Main CPU environment. This machine has no conda: the live env is .venv built with pip from the same list
# (Python 3.13.5, numpy 2.5.4, scipy 1.18.1, sympy 1.14.0, mpmath 1.3.0, gmpy2 2.3.2, python-flint 0.9.0,
# matplotlib 3.11.2, pandas 3.1.1, pyarrow 26.0.1).
name: msps
channels: [conda-forge]
dependencies:
  - python=3.13
  - numpy
  - scipy
  - sympy
  - mpmath
  - gmpy2
  - python-flint
  - matplotlib
  - pandas
  - pyarrow
  - pyyaml
  - psutil
  - pytest
  - hypothesis
