name: nb3_ensemble
builder: nbody
equations: planar equal-mass three-body problem, rational points on a circle, zero momentum
regime: chaotic, bound, filtered (spec 6.1)
params: {masses: ["1", "1", "1"], dim: 2}
ic:
  generator: ensemble3
  seed: 3001
  R_min: "3/2"
  R_max: "3"
  vmax: "1/2"
  count: {dev: 20, paper: 100}
  filter: {energy_max: "0", dmin0: "1/2", dmax: "40", T: "120", order: 16, max_steps: 100000}
reference: {order: 56, bits: 400, check_order: 64, check_bits: 500, safety: 8, cap: "1/2", tol_check: 1.0e-30}
T: 120
tolerances: [1.0e-6, 1.0e-3]
variants:
  # the base card's filter and ICs; at 56/400 #1 missed tol_check (4.5e-30), at 64/500 #2 and #14 did (2.6e-30 worst)
  r4:
    reference: {order: 80, bits: 600, check_order: 90, check_bits: 700, max_steps: 150000}
  # paper IC 65 missed tol_check at 80/600, 3.45e-21
  r5:
    reference: {order: 100, bits: 800, check_order: 112, check_bits: 900, max_steps: 150000}
