[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msps"
version = "0.1.0"
description = "Truncation order x arithmetic precision in chaotic ODE integration"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "sympy", "mpmath", "gmpy2", "python-flint", "matplotlib", "pandas", "pyarrow", "pyyaml", "psutil"]

[project.scripts]
msps = "msps.runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: heavy checks", "campaign: long campaign checks", "gpu: needs GPU environment"]
addopts = "-q"
