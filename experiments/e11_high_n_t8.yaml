study: E11hi
description: N = 8, 10 in E11 at T = 8, unchanged 56/400 and tol_check. N_8_hp and N_10_hp are the T = 30 bridge, one IC each, 80/600
budget_hours: 24
job_wall_limit_s: 21600
groups:
  - {name: t8_n8, kind: reference, grid: {case: ["nbN_circle:N_8_T8", "nbN_alternating:rings_N_8_T8", "nbN_cluster:N_8_T8"], ic: [0, 1, 2]}, paper: {grid: {ic: [0, 1, 2, 3, 4]}}}
  - {name: t8_n10, kind: reference, grid: {case: ["nbN_circle:N_10_T8", "nbN_alternating:rings_N_10_T8", "nbN_cluster:N_10_T8"], ic: [0, 1, 2]}, paper: {grid: {ic: [0, 1, 2, 3, 4]}}}
  - {name: amp, kind: amplification, grid: {case: ["nbN_circle:N_8_T8", "nbN_alternating:rings_N_8_T8", "nbN_cluster:N_8_T8", "nbN_circle:N_10_T8", "nbN_alternating:rings_N_10_T8", "nbN_cluster:N_10_T8"], ic: [0, 1, 2]}, paper: {grid: {ic: [0, 1, 2, 3, 4]}}}
  - name: local
    kind: local
    fixed: {orders: [4, 8, 12, 16, 20, 24, 28, 32, 36, 40], states: 60}
    grid: {case: ["nbN_circle:N_8_T8", "nbN_alternating:rings_N_8_T8", "nbN_cluster:N_8_T8", "nbN_circle:N_10_T8", "nbN_alternating:rings_N_10_T8", "nbN_cluster:N_10_T8"], ic: [0]}
  - name: sweep
    kind: traj
    fixed: {method: taylor, schedule: shared, stop_err: 1.0}
    grid: {case: ["nbN_circle:N_8_T8", "nbN_alternating:rings_N_8_T8", "nbN_cluster:N_8_T8", "nbN_circle:N_10_T8", "nbN_alternating:rings_N_10_T8", "nbN_cluster:N_10_T8"], ic: [0, 1, 2], arith: [f32, f64, dd, mpfr-80, mpfr-113], n: [4, 8, 12, 16, 20, 24, 28, 32]}
    paper: {grid: {ic: [0, 1, 2, 3, 4]}}
  - name: bridge
    kind: traj
    fixed: {method: taylor, schedule: shared, stop_err: 1.0}
    grid: {case: ["nbN_circle:N_8_hp", "nbN_circle:N_10_hp"], ic: [0], arith: [f32, f64, dd, mpfr-80, mpfr-113], n: [4, 8, 12, 16, 20, 24, 28, 32]}
  # nbN_circle:N_10_T8 #2 failed its check at 56/400 (5.9e-27)
  - {name: refs_fix, modes: [paper], kind: reference, grid: {case: ["nbN_circle:N_10_T8_hp"], ic: [2]}}
  - {name: amp_fix, modes: [paper], kind: amplification, grid: {case: ["nbN_circle:N_10_T8_hp"], ic: [2]}}
  - name: sweep_fix
    modes: [paper]
    kind: traj
    fixed: {method: taylor, schedule: shared, stop_err: 1.0}
    grid: {case: ["nbN_circle:N_10_T8_hp"], ic: [2], arith: [f32, f64, dd, mpfr-80, mpfr-113], n: [4, 8, 12, 16, 20, 24, 28, 32]}
