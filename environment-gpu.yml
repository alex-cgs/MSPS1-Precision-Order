# GPU environment: JAX with CUDA 12 wheels (chosen; runs on the GTX 1080 Ti, driver 550.163, jax 0.12.0.1, checked 2026-11-04).
# One env per machine. Live on this machine as .venv-gpu; on ops created by scripts/ops_night.sh.
# On a conda machine: conda env create -f environment-gpu.yml
name: msps-gpu
channels: [conda-forge]
dependencies:
  - python=3.13
  - numpy
  - scipy
  - sympy
  - mpmath
  - gmpy2
  - python-flint
  - pandas
  - pyarrow
  - pyyaml
  - psutil
  - pytest
  - pip
  - pip:
      - "jax[cuda12]"
